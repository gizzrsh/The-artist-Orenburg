services:
    php:
        container_name: php
        image: php
        restart: always
        build:
            context: .
            dockerfile: Dockerfile
            target: base
        ports:
            - "${PORT}:80"
        env_file:
            - .env
        volumes:
            - .:/var/www/html

    db:
        image: mariadb
        restart: always
        environment:
            MARIADB_ROOT_PASSWORD: "${DB_PASS}"
            MARIADB_DATABASE: "${DB_NAME}"
            MARIADB_USER: "${DB_USER}"
            MARIADB_PASSWORD: "${DB_PASS}"
            TZ: Asia/Yekaterinburg
        volumes:
            - db_data:/var/lib/mysql

    adminer:
        image: adminer
        restart: always
        ports:
            - 8081:8080

    mailpit:
        image: axllent/mailpit
        restart: unless-stopped
        ports:
            - 8025:8025
            - 1025:1025

volumes:
    db_data: